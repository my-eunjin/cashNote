<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시안 1 - 모던 코지 가계부 & 일기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFFBF4;
            --card-bg: #FFFFFF;
            --text-main: #2C3E50;
            --text-sub: #7F8C8D;
            --primary: #FF7E67;
            --primary-light: #FFEBE7;
            --secondary: #3B9B85;
            --secondary-light: #E8F5F2;
            --accent-expense: #E74C3C;
            --accent-income: #27AE60;
            --border-color: #F0E6DF;
            --radius-lg: 20px;
            --radius-md: 14px;
            --shadow: 0 8px 24px rgba(220, 180, 160, 0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 16px; }

        .app-layout { width: 100%; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

        .app-header {
            background: var(--card-bg); border-radius: var(--radius-lg);
            padding: 16px 24px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
        }

        .month-selector { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .month-btn {
            background: var(--primary-light); color: var(--primary); border: none;
            width: 32px; height: 32px; border-radius: 10px; cursor: pointer; font-weight: 700;
            display: flex; align-items: center; justify-content: center; font-size: 14px;
        }
        .month-btn:hover { background: var(--primary); color: white; }

        .today-go-btn {
            background: var(--secondary-light); color: var(--secondary);
            border: 1px solid #B8E0D7; padding: 6px 14px; border-radius: 12px;
            font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px;
            transition: all 0.2s;
        }
        .today-go-btn:hover { background: var(--secondary); color: white; }

        .tab-switcher { display: flex; background: #F0E6DC; padding: 4px; border-radius: 14px; gap: 4px; flex-wrap: wrap; }
        .tab-btn { padding: 8px 16px; border: none; background: none; font-size: 13px; font-weight: 600; color: var(--text-sub); border-radius: 10px; cursor: pointer; transition: all 0.2s ease; }
        .tab-btn.active { background: var(--card-bg); color: var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.06); font-weight: 700; }

        .summary-card {
            background: var(--card-bg); border-radius: var(--radius-lg); padding: 16px 20px;
            box-shadow: var(--shadow); border: 1px solid var(--border-color);
            display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 16px; text-align: center;
        }
        .summary-item { display: flex; flex-direction: column; gap: 4px; }
        .summary-label { font-size: 12px; color: var(--text-sub); }
        .summary-amount { font-size: 17px; font-weight: 700; }
        .summary-amount.income { color: var(--accent-income); }
        .summary-amount.expense { color: var(--accent-expense); }

        .main-content-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 850px) { .main-content-grid { grid-template-columns: 1.3fr 1fr; } }

        .calendar-card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 18px 16px; box-shadow: var(--shadow); border: 1px solid var(--border-color); width: 100%; }
        .calendar-days-header { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; font-weight: 700; color: var(--text-sub); margin-bottom: 10px; }
        .calendar-days-header span:nth-child(1) { color: #E74C3C; }
        .calendar-days-header span:nth-child(7) { color: #2980B9; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: 100%; }

        .calendar-cell {
            min-width: 0; min-height: 65px; border-radius: 10px;
            padding: 4px 2px; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            cursor: pointer; transition: all 0.2s ease;
            background: #FFFCF9; border: 1.5px solid var(--border-color);
            box-sizing: border-box; user-select: none;
        }
        .calendar-cell * { pointer-events: none; }
        @media (max-width: 480px) { .calendar-cell { min-height: 52px; padding: 2px 1px; } }
        .calendar-cell:hover { background-color: var(--primary-light); border-color: var(--primary); transform: scale(1.03); }
        .calendar-cell.selected { background-color: #FFE8E3 !important; border-color: var(--primary) !important; box-shadow: 0 0 0 3px #FF7E67, 0 4px 12px rgba(255,126,103,0.3) !important; transform: scale(1.04); z-index: 5; }
        .calendar-cell.selected .date-num { color: var(--primary); font-size: 14px; font-weight: 800; }
        .calendar-cell.other-month { opacity: 0.3; background: #F9F9F9; pointer-events: none; }
        .date-num { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
        .sun { color: #E74C3C; } .sat { color: #2980B9; }
        .cal-badge { font-size: 9px; font-weight: 700; padding: 1px 2px; border-radius: 4px; width: 95%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
        .cal-badge.exp { color: #E74C3C; background: rgba(231, 76, 60, 0.12); }
        .cal-badge.inc { color: #27AE60; background: rgba(39, 174, 96, 0.12); }
        .cal-diary-badge { font-size: 9px; margin-top: 2px; background: var(--secondary-light); color: var(--secondary); padding: 1px 4px; border-radius: 4px; font-weight: 700; }

        .detail-panel { background: var(--card-bg); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 14px; }
        .mode-toggle-bar { display: flex; background: #F4EBE1; padding: 3px; border-radius: 12px; gap: 4px; }
        .mode-btn { flex: 1; padding: 8px 0; border: none; background: none; font-size: 12px; font-weight: 600; color: var(--text-sub); border-radius: 9px; cursor: pointer; text-align: center; }
        .mode-btn.active { background: var(--card-bg); color: var(--primary); font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .detail-header-title { font-size: 16px; font-weight: 800; color: var(--primary); display: flex; justify-content: space-between; align-items: center; background: var(--primary-light); padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(255,126,103,0.3); }

        .section-label { font-size: 13px; font-weight: 700; color: var(--text-sub); margin: 10px 0 6px 0; display: flex; align-items: center; gap: 6px; }
        .date-group-card { background: #FFFBF9; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px; margin-bottom: 10px; }
        .date-group-header { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px dashed var(--border-color); display: flex; justify-content: space-between; }
        .list-card { background: #FFFFFF; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .list-left { display: flex; align-items: center; gap: 10px; }
        .icon-box { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; background: #FFF3EE; }
        .item-title { font-size: 13px; font-weight: 700; }
        .item-category { font-size: 11px; color: var(--text-sub); }
        .item-amount { font-size: 13px; font-weight: 700; }
        .item-amount.minus { color: var(--accent-expense); }
        .item-amount.plus { color: var(--accent-income); }
        .diary-card { background: #F4F9F7; border-radius: 10px; padding: 12px; border: 1px solid #D5EBE5; margin-top: 6px; }
        .diary-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .diary-mood-badge { background: #FFFFFF; color: var(--secondary); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; border: 1px solid #B8E0D7; }
        .diary-text { font-family: 'Gamja Flower', cursive; font-size: 17px; line-height: 1.4; color: #2C3E50; margin-bottom: 6px; }
        .diary-tags { display: flex; gap: 4px; flex-wrap: wrap; }
        .tag-pill { font-size: 10px; color: var(--secondary); background: #FFFFFF; padding: 1px 6px; border-radius: 4px; border: 1px solid #D5EBE5; }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(44, 62, 80, 0.5); backdrop-filter: blur(4px);
            z-index: 100; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-overlay.open { display: flex; }

        .modal-box {
            background: var(--card-bg); border-radius: 24px;
            width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0,0,0,0.18);
            animation: slideUp 0.25s ease;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .modal-header {
            padding: 20px 24px 0;
            display: flex; justify-content: space-between; align-items: center;
        }

        .modal-title { font-size: 20px; font-weight: 800; color: var(--text-main); }

        .modal-close {
            width: 32px; height: 32px; border-radius: 10px; border: none;
            background: var(--primary-light); color: var(--primary);
            font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .modal-tabs {
            display: flex; margin: 16px 24px 0; background: #F0E6DC;
            padding: 4px; border-radius: 12px; gap: 4px;
        }
        .modal-tab {
            flex: 1; padding: 9px 0; border: none; background: none;
            font-size: 13px; font-weight: 600; color: var(--text-sub);
            border-radius: 9px; cursor: pointer; text-align: center; transition: all 0.2s;
        }
        .modal-tab.active { background: var(--card-bg); color: var(--primary); font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

        .modal-body { padding: 20px 24px 24px; }

        .form-section { display: none; flex-direction: column; gap: 14px; }
        .form-section.active { display: flex; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-label { font-size: 12px; font-weight: 700; color: var(--text-sub); }

        .form-input, .form-select, .form-textarea {
            padding: 10px 14px; border-radius: 12px;
            border: 1.5px solid var(--border-color);
            font-size: 14px; color: var(--text-main);
            background: #FFFCF9; outline: none;
            font-family: 'Noto Sans KR', sans-serif;
            transition: border-color 0.2s;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary); }
        .form-textarea { resize: vertical; min-height: 100px; }

        .type-toggle { display: flex; gap: 8px; }
        .type-btn {
            flex: 1; padding: 10px 0; border-radius: 12px;
            border: 1.5px solid var(--border-color); background: #FFFCF9;
            font-size: 13px; font-weight: 700; cursor: pointer; text-align: center;
            transition: all 0.2s;
        }
        .type-btn.exp.active { background: #FFF0EE; border-color: var(--accent-expense); color: var(--accent-expense); }
        .type-btn.inc.active { background: #EDFAF3; border-color: var(--accent-income); color: var(--accent-income); }

        .mood-picker { display: flex; gap: 8px; flex-wrap: wrap; }
        .mood-btn {
            padding: 6px 12px; border-radius: 10px; border: 1.5px solid var(--border-color);
            background: #FFFCF9; font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        .mood-btn.active { border-color: var(--secondary); background: var(--secondary-light); }

        .tag-input-row { display: flex; gap: 8px; }
        .tag-input-row .form-input { flex: 1; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; }
        .tag-chip { background: var(--secondary-light); color: var(--secondary); border: 1px solid #B8E0D7; padding: 3px 10px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 4px; }
        .tag-chip button { background: none; border: none; color: var(--secondary); cursor: pointer; font-size: 13px; line-height: 1; }

        .modal-footer {
            padding: 0 24px 24px;
            display: flex; gap: 10px;
        }

        .btn-cancel {
            flex: 1; padding: 12px; border-radius: 14px; border: 1.5px solid var(--border-color);
            background: #FFFCF9; color: var(--text-sub); font-size: 14px; font-weight: 700; cursor: pointer;
        }
        .btn-save {
            flex: 2; padding: 12px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, var(--primary), #FF9A7E);
            color: white; font-size: 14px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 14px rgba(255,126,103,0.35);
        }
        .btn-save:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(255,126,103,0.4); }
    </style>
</head>
<body>

<div class="app-layout">
    <header class="app-header">
        <div class="month-selector">
            <button class="month-btn" onclick="prevMonth()">◀</button>
            <span id="currentYearMonthText">2026년 8월</span>
            <button class="month-btn" onclick="nextMonth()">▶</button>
            <button class="today-go-btn" onclick="goToToday()">📍 오늘로 이동</button>
        </div>
        <div class="tab-switcher">
            <button class="tab-btn active" id="tabAll" onclick="switchFilter('all')">🌟 가계부+일기 전체</button>
            <button class="tab-btn" id="tabLedger" onclick="switchFilter('ledger')">💰 가계부</button>
            <button class="tab-btn" id="tabDiary" onclick="switchFilter('diary')">📝 일기</button>
        </div>
    </header>

    <div class="summary-card">
        <div class="summary-item">
            <span class="summary-label" id="sumLabelIncome">8월 총 수입</span>
            <span class="summary-amount income">+2,750,000원</span>
        </div>
        <div class="summary-item">
            <span class="summary-label" id="sumLabelExpense">8월 총 지출</span>
            <span class="summary-amount expense">-1,540,000원</span>
        </div>
    </div>

    <div class="main-content-grid">
        <div class="calendar-card">
            <div class="calendar-days-header">
                <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="detail-panel">
            <div class="mode-toggle-bar">
                <button class="mode-btn active" id="modeSelected" onclick="switchTimelineMode('selected')">📍 선택한 날짜</button>
                <button class="mode-btn" id="modeAll" onclick="switchTimelineMode('all')">📜 전체 타임라인</button>
            </div>

            <div class="detail-header-title">
                <span id="detailTitleText">📍 8월 9일 내역</span>
                <button onclick="openModal()" style="background: var(--primary); color: white; border: none; padding: 7px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;">✏️ 새 기록 작성</button>
            </div>

            <div id="timelineContainer"></div>
        </div>
    </div>
</div>

<!-- ===== WRITE MODAL ===== -->
<div class="modal-overlay" id="writeModal">
    <div class="modal-box">
        <div class="modal-header">
            <span class="modal-title">✏️ 새 기록 작성</span>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>

        <div class="modal-tabs">
            <button class="modal-tab active" id="mtabLedger" onclick="switchModalTab('ledger')">💰 가계부 작성</button>
            <button class="modal-tab" id="mtabDiary" onclick="switchModalTab('diary')">📝 일기 작성</button>
        </div>

        <div class="modal-body">
            <!-- Ledger Form -->
            <div class="form-section active" id="formLedger">
                <div class="form-group">
                    <label class="form-label">수입 / 지출 구분</label>
                    <div class="type-toggle">
                        <button class="type-btn exp active" id="typeExp" onclick="setType('exp')">📉 지출</button>
                        <button class="type-btn inc" id="typeInc" onclick="setType('inc')">📈 수입</button>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">날짜</label>
                        <input class="form-input" type="date" id="ledgerDate">
                    </div>
                    <div class="form-group">
                        <label class="form-label">금액 (원)</label>
                        <input class="form-input" type="number" id="ledgerAmount" placeholder="15000">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">카테고리</label>
                        <select class="form-select" id="ledgerCategory">
                            <option value="식비">🍱 식비</option>
                            <option value="교통">🚌 교통</option>
                            <option value="문화">🎬 문화/여가</option>
                            <option value="쇼핑">🛍️ 쇼핑</option>
                            <option value="생활">🏠 생활</option>
                            <option value="의료">💊 의료</option>
                            <option value="수입">💰 수입</option>
                            <option value="기타">📌 기타</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">결제 수단</label>
                        <select class="form-select" id="ledgerPayment">
                            <option value="카드">💳 카드</option>
                            <option value="현금">💵 현금</option>
                            <option value="계좌이체">🏦 계좌이체</option>
                            <option value="카카오페이">🟡 카카오페이</option>
                            <option value="네이버페이">🟢 네이버페이</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">내용 / 사용처</label>
                    <input class="form-input" type="text" id="ledgerTitle" placeholder="스타벅스 아이스 아메리카노">
                </div>
                <div class="form-group">
                    <label class="form-label">메모 (선택)</label>
                    <input class="form-input" type="text" id="ledgerMemo" placeholder="간단한 메모를 남겨보세요">
                </div>
            </div>

            <!-- Diary Form -->
            <div class="form-section" id="formDiary">
                <div class="form-group">
                    <label class="form-label">날짜</label>
                    <input class="form-input" type="date" id="diaryDate">
                </div>
                <div class="form-group">
                    <label class="form-label">오늘의 기분</label>
                    <div class="mood-picker" id="moodPicker">
                        <button class="mood-btn active" onclick="setMood(this, '😊 행복')">😊 행복</button>
                        <button class="mood-btn" onclick="setMood(this, '😌 평온')">😌 평온</button>
                        <button class="mood-btn" onclick="setMood(this, '😢 슬픔')">😢 슬픔</button>
                        <button class="mood-btn" onclick="setMood(this, '😤 화남')">😤 화남</button>
                        <button class="mood-btn" onclick="setMood(this, '😴 피곤')">😴 피곤</button>
                        <button class="mood-btn" onclick="setMood(this, '🎉 신남')">🎉 신남</button>
                        <button class="mood-btn" onclick="setMood(this, '🤔 생각많음')">🤔 생각</button>
                        <button class="mood-btn" onclick="setMood(this, '💪 의욕충만')">💪 의욕</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">제목 (선택)</label>
                    <input class="form-input" type="text" id="diaryTitle" placeholder="오늘의 한 줄 제목">
                </div>
                <div class="form-group">
                    <label class="form-label">일기 내용</label>
                    <textarea class="form-textarea" id="diaryContent" placeholder="오늘 있었던 일, 느꼈던 감정을 자유롭게 적어보세요 📖&#10;&#10;여기는 나만의 특별한 공간이에요 :)"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">태그 (Enter로 추가)</label>
                    <div class="tag-input-row">
                        <input class="form-input" type="text" id="tagInput" placeholder="#카페 #독서" onkeydown="addTag(event)">
                    </div>
                    <div class="tag-list" id="tagList"></div>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">취소</button>
            <button class="btn-save" onclick="saveEntry()">💾 저장하기</button>
        </div>
    </div>
</div>

<script>
    let currentYear = 2026, currentMonth = 8, selectedDay = 9;
    let activeFilter = 'all', timelineMode = 'selected';
    let selectedMood = '😊 행복', selectedType = 'exp';
    let currentTags = [];
    let userEntries = {}; // Stores user-added entries

    const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
    function getWeekdayName(y, m, d) { return dayNames[new Date(y, m - 1, d).getDay()]; }

    const sampleActivities = [
        { icon: '☕', name: '아이스 아메리카노', cat: '식비', cost: -4500, mood: '☕ 상쾌함', diary: '시원한 커피 한 잔으로 시작한 상쾌한 아침.', tag: '#카페타임' },
        { icon: '🍱', name: '점심 정식 세트', cat: '식비', cost: -12000, mood: '🍱 맛있는 점심', diary: '좋아하는 식당에서 알찬 점심 식사.', tag: '#맛집탐방' },
        { icon: '🚌', name: '대중교통비', cat: '교통', cost: -3200, mood: '🌱 무탈함', diary: '창밖 풍경 보며 편안하게 이동.', tag: '#일상' },
        { icon: '📚', name: '서점 서적', cat: '문화', cost: -18000, mood: '📖 지성 충전', diary: '에세이 책 한 권을 읽으며 마음에 평화 얻기.', tag: '#독서' },
        { icon: '🍕', name: '파스타 & 피자', cat: '식비', cost: -26000, mood: '🎉 즐거운 저녁', diary: '맛있는 요리와 함께한 행복한 수다 타임.', tag: '#파스타' },
    ];

    function getMockData(y, m, d) {
        const key = `${y}-${m}-${d}`;
        const base = getBaseData(y, m, d);
        if (userEntries[key]) {
            const u = userEntries[key];
            if (u.ledger) { base.items = [...base.items, ...u.ledger]; }
            if (u.diary) { base.diary = u.diary; }
        }
        return base;
    }

    function getBaseData(y, m, d) {
        if (m === 8 && d === 7) return { inc: '+250,000원', items: [{ icon: '💰', title: '프리랜서 외주 대금', category: '수입', amount: '+250,000원', type: 'plus' }], diary: { mood: '💰 든든함', text: '외주 작업 대금이 입금되어 뿌듯했던 날!' , tags: ['#수입', '#외주'] } };
        if (m === 8 && d === 9) return { expense: '-34,000원', items: [{ icon: '☕', title: '스타벅스 라떼', category: '식비', amount: '-6,000원', type: 'minus' }, { icon: '🍣', title: '주말 초밥 세트', category: '식비', amount: '-28,000원', type: 'minus' }], diary: { mood: '🎉 신남', text: '친구들과 오랜만에 만나 스시 오마카세 즐겼다!' , tags: ['#주말', '#스시'] } };
        const act = sampleActivities[(d * 3 + m) % sampleActivities.length];
        return { expense: `${act.cost.toLocaleString()}원`, items: [{ icon: act.icon, title: act.name, category: act.cat, amount: `${act.cost.toLocaleString()}원`, type: 'minus' }], diary: { mood: act.mood, text: `${m}월 ${d}일, ${act.diary}`, tags: [act.tag] } };
    }

    function prevMonth() { currentMonth--; if (currentMonth < 1) { currentMonth = 12; currentYear--; } selectedDay = 1; renderAll(); }
    function nextMonth() { currentMonth++; if (currentMonth > 12) { currentMonth = 1; currentYear++; } selectedDay = 1; renderAll(); }
    function goToToday() { currentYear = 2026; currentMonth = 8; selectedDay = 9; renderAll(); }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        const totalDays = new Date(currentYear, currentMonth, 0).getDate();
        const firstDow = new Date(currentYear, currentMonth - 1, 1).getDay();
        const prevTotal = new Date(currentYear, currentMonth - 1, 0).getDate();
        for (let i = firstDow - 1; i >= 0; i--) { const c = document.createElement('div'); c.className = 'calendar-cell other-month'; c.innerHTML = `<span class="date-num">${prevTotal - i}</span>`; grid.appendChild(c); }
        for (let d = 1; d <= totalDays; d++) {
            const cell = document.createElement('div');
            const dow = new Date(currentYear, currentMonth - 1, d).getDay();
            cell.className = `calendar-cell ${d === selectedDay ? 'selected' : ''}`;
            cell.setAttribute('onclick', `selectDate(${d})`);
            const data = getMockData(currentYear, currentMonth, d);
            let badges = '';
            if (data.expense) badges += `<div class="cal-badge exp">${data.expense}</div>`;
            if (data.inc) badges += `<div class="cal-badge inc">${data.inc}</div>`;
            if (data.diary) badges += `<div class="cal-diary-badge">📖 일기</div>`;
            cell.innerHTML = `<span class="date-num ${dow===0?'sun':dow===6?'sat':''}">${d}</span>${badges}`;
            grid.appendChild(cell);
        }
        const rem = (firstDow + totalDays) % 7;
        for (let d = 1; d <= (rem === 0 ? 0 : 7 - rem); d++) { const c = document.createElement('div'); c.className = 'calendar-cell other-month'; c.innerHTML = `<span class="date-num">${d}</span>`; grid.appendChild(c); }
    }

    function selectDate(d) { selectedDay = Number(d); timelineMode = 'selected'; document.getElementById('modeSelected').classList.add('active'); document.getElementById('modeAll').classList.remove('active'); renderAll(); }
    function switchTimelineMode(m) { timelineMode = m; document.getElementById('modeSelected').classList.toggle('active', m==='selected'); document.getElementById('modeAll').classList.toggle('active', m==='all'); renderTimeline(); }
    function switchFilter(f) { activeFilter = f; ['all','ledger','diary'].forEach(x => document.getElementById('tab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active', x===f)); renderTimeline(); }

    function renderTimeline() {
        const container = document.getElementById('timelineContainer');
        const titleEl = document.getElementById('detailTitleText');
        const totalDays = new Date(currentYear, currentMonth, 0).getDate();
        if (timelineMode === 'selected') {
            titleEl.innerText = `📍 ${currentMonth}월 ${selectedDay}일 (${getWeekdayName(currentYear, currentMonth, selectedDay)}) 내역`;
            container.innerHTML = renderDayHtml(selectedDay);
        } else {
            titleEl.innerText = `📜 ${currentYear}년 ${currentMonth}월 전체 타임라인`;
            let html = '';
            for (let d = 1; d <= totalDays; d++) {
                const data = getMockData(currentYear, currentMonth, d);
                html += `<div class="date-group-card" onclick="selectDate(${d})" style="cursor:pointer;"><div class="date-group-header"><span>📅 ${currentMonth}월 ${d}일 (${getWeekdayName(currentYear, currentMonth, d)})</span><span style="font-size:11px;color:var(--text-sub);">${data.expense || data.inc || ''}</span></div>${renderDayHtml(d)}</div>`;
            }
            container.innerHTML = html;
        }
    }

    function renderDayHtml(day) {
        const data = getMockData(currentYear, currentMonth, day);
        if (!data) return `<div style="font-size:12px;color:var(--text-sub);text-align:center;padding:10px;">등록된 기록이 없습니다.</div>`;
        let html = '';
        if ((activeFilter === 'all' || activeFilter === 'ledger') && data.items?.length > 0) {
            html += `<div class="section-label">💳 가계부 내역</div>`;
            html += data.items.map(i => `<div class="list-card"><div class="list-left"><div class="icon-box">${i.icon}</div><div><div class="item-title">${i.title}</div><div class="item-category">${i.category}</div></div></div><span class="item-amount ${i.type}">${i.amount}</span></div>`).join('');
        }
        if ((activeFilter === 'all' || activeFilter === 'diary') && data.diary) {
            html += `<div class="section-label">📖 오늘의 일기</div><div class="diary-card"><div class="diary-top"><span class="diary-mood-badge">${data.diary.mood}</span></div><div class="diary-text">"${data.diary.text}"</div><div class="diary-tags">${data.diary.tags.map(t=>`<span class="tag-pill">${t}</span>`).join('')}</div></div>`;
        }
        return html || `<div style="font-size:12px;color:var(--text-sub);text-align:center;padding:10px;">등록된 기록이 없습니다.</div>`;
    }

    function renderAll() {
        document.getElementById('currentYearMonthText').innerText = `${currentYear}년 ${currentMonth}월`;
        document.getElementById('sumLabelIncome').innerText = `${currentMonth}월 총 수입`;
        document.getElementById('sumLabelExpense').innerText = `${currentMonth}월 총 지출`;
        renderCalendar(); renderTimeline();
    }

    /* Modal */
    function openModal() {
        const modal = document.getElementById('writeModal');
        modal.classList.add('open');
        const dateStr = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(selectedDay).padStart(2,'0')}`;
        document.getElementById('ledgerDate').value = dateStr;
        document.getElementById('diaryDate').value = dateStr;
    }

    function closeModal() { document.getElementById('writeModal').classList.remove('open'); }

    document.getElementById('writeModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

    function switchModalTab(tab) {
        document.getElementById('mtabLedger').classList.toggle('active', tab === 'ledger');
        document.getElementById('mtabDiary').classList.toggle('active', tab === 'diary');
        document.getElementById('formLedger').classList.toggle('active', tab === 'ledger');
        document.getElementById('formDiary').classList.toggle('active', tab === 'diary');
    }

    function setType(type) {
        selectedType = type;
        document.getElementById('typeExp').classList.toggle('active', type === 'exp');
        document.getElementById('typeInc').classList.toggle('active', type === 'inc');
    }

    function setMood(btn, mood) {
        selectedMood = mood;
        document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function addTag(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            const input = document.getElementById('tagInput');
            let val = input.value.trim();
            if (!val) return;
            if (!val.startsWith('#')) val = '#' + val;
            currentTags.push(val);
            renderTags();
            input.value = '';
        }
    }

    function renderTags() {
        const list = document.getElementById('tagList');
        list.innerHTML = currentTags.map((t, i) => `<span class="tag-chip">${t} <button onclick="removeTag(${i})">×</button></span>`).join('');
    }

    function removeTag(i) { currentTags.splice(i, 1); renderTags(); }

    function saveEntry() {
        const activeTab = document.getElementById('formLedger').classList.contains('active') ? 'ledger' : 'diary';
        const dateStr = document.getElementById(activeTab === 'ledger' ? 'ledgerDate' : 'diaryDate').value;
        if (!dateStr) { alert('날짜를 선택해주세요.'); return; }
        const parts = dateStr.split('-');
        const y = parseInt(parts[0]), m = parseInt(parts[1]), d = parseInt(parts[2]);
        const key = `${y}-${m}-${d}`;
        if (!userEntries[key]) userEntries[key] = {};

        if (activeTab === 'ledger') {
            const amount = document.getElementById('ledgerAmount').value;
            const title = document.getElementById('ledgerTitle').value;
            if (!amount || !title) { alert('금액과 내용을 입력해주세요.'); return; }
            const cat = document.getElementById('ledgerCategory').value;
            const icons = { '식비':'🍱', '교통':'🚌', '문화':'🎬', '쇼핑':'🛍️', '생활':'🏠', '의료':'💊', '수입':'💰', '기타':'📌' };
            const isInc = selectedType === 'inc';
            if (!userEntries[key].ledger) userEntries[key].ledger = [];
            userEntries[key].ledger.push({ icon: icons[cat] || '📌', title, category: cat, amount: `${isInc ? '+' : '-'}${parseInt(amount).toLocaleString()}원`, type: isInc ? 'plus' : 'minus' });
            alert(`✅ ${m}월 ${d}일 가계부가 저장되었습니다!`);
        } else {
            const content = document.getElementById('diaryContent').value;
            if (!content) { alert('일기 내용을 입력해주세요.'); return; }
            userEntries[key].diary = { mood: selectedMood, text: content, tags: [...currentTags] };
            currentTags = [];
            renderTags();
            alert(`✅ ${m}월 ${d}일 일기가 저장되었습니다!`);
        }

        closeModal();
        currentYear = y; currentMonth = m; selectedDay = d; timelineMode = 'selected';
        document.getElementById('modeSelected').classList.add('active');
        document.getElementById('modeAll').classList.remove('active');
        renderAll();
    }

    renderAll();
</script>
</body>
</html>
