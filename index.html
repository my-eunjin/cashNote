<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가계부 & 일기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-body: #F1F5F9;
            --bg-surface: #FFFFFF;
            --text-primary: #0F172A;
            --text-muted: #64748B;
            --indigo-600: #4F46E5;
            --indigo-50: #EEF2FF;
            --coral-500: #F43F5E;
            --emerald-500: #10B981;
            --amber-500: #F59E0B;
            --border: #E2E8F0;
            --radius-card: 16px;
            --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
        }

        .dash-wrapper {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg-surface);
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .dash-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .month-nav-btn {
            background: var(--indigo-50);
            color: var(--indigo-600);
            border: 1px solid #C7D2FE;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .month-nav-btn:hover {
            background: var(--indigo-600);
            color: white;
        }

        .month-label {
            font-size: 16px;
            font-weight: 800;
            color: var(--indigo-600);
        }

        .today-go-btn {
            background: #F0FDF4;
            color: var(--emerald-500);
            border: 1px solid #BBF7D0;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .today-go-btn:hover {
            background: var(--emerald-500);
            color: white;
        }

        .metrics-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .metric-pill {
            background: var(--bg-body);
            padding: 8px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .metric-val {
            font-size: 13px;
            font-weight: 700;
        }

        .dash-tab-bar {
            display: flex;
            padding: 0 24px;
            background: #FAFAFA;
            border-bottom: 1px solid var(--border);
            gap: 8px;
            flex-wrap: wrap;
        }

        .dash-tab {
            padding: 12px 18px;
            border: none;
            background: none;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dash-tab.active {
            color: var(--indigo-600);
            font-weight: 700;
        }

        .dash-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--indigo-600);
            border-radius: 3px 3px 0 0;
        }

        .dash-body {
            display: grid;
            grid-template-columns: 1fr;
            padding: 20px;
            gap: 20px;
        }

        @media (min-width: 850px) {
            .dash-body {
                grid-template-columns: 1.3fr 1fr;
            }
        }

        .dash-card {
            background: var(--bg-surface);
            border-radius: var(--radius-card);
            border: 1px solid var(--border);
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            margin-bottom: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
        }

        .cal-table-head {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            width: 100%;
        }

        .cal-cell {
            min-width: 0;
            min-height: 65px;
            border-radius: 10px;
            background: #F8FAFC;
            border: 1.5px solid var(--border);
            padding: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.15s ease;
            box-sizing: border-box;
            user-select: none;
        }

        .cal-cell * {
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .cal-cell {
                min-height: 52px;
                padding: 2px 1px;
            }
        }

        .cal-cell:hover {
            border-color: var(--indigo-600);
            background: var(--indigo-50);
            transform: scale(1.03);
        }

        .cal-cell.selected {
            border-color: var(--indigo-600) !important;
            box-shadow: 0 0 0 3px var(--indigo-600), 0 4px 12px rgba(79, 70, 229, 0.3) !important;
            background: #FFF !important;
            transform: scale(1.04);
            z-index: 5;
        }

        .cal-cell.selected .cal-date {
            color: var(--indigo-600);
            font-size: 14px;
            font-weight: 800;
        }

        .cal-cell.other-month {
            opacity: 0.3;
            pointer-events: none;
        }

        .cal-date {
            font-size: 12px;
            font-weight: 700;
        }

        .cal-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: flex-end;
        }

        .tag-exp {
            font-size: 9px;
            font-weight: 700;
            color: var(--coral-500);
        }

        .tag-inc {
            font-size: 9px;
            font-weight: 700;
            color: var(--emerald-500);
        }

        .tag-diary {
            font-size: 9px;
            font-weight: 700;
            color: var(--indigo-600);
            background: var(--indigo-50);
            padding: 1px 3px;
            border-radius: 4px;
        }

        .cat-bar-item {
            margin-bottom: 10px;
        }

        .cat-bar-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .cat-progress {
            height: 8px;
            background: var(--bg-body);
            border-radius: 4px;
            overflow: hidden;
        }

        .cat-fill {
            height: 100%;
            border-radius: 4px;
        }

        .mode-toggle-bar {
            display: flex;
            background: var(--bg-body);
            border: 1px solid var(--border);
            padding: 3px;
            border-radius: 12px;
            gap: 4px;
            margin-bottom: 14px;
        }

        .mode-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: none;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            border-radius: 9px;
            cursor: pointer;
            text-align: center;
        }

        .mode-btn.active {
            background: var(--bg-surface);
            color: var(--indigo-600);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            font-weight: 700;
        }

        .day-panel-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--indigo-600);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--indigo-50);
            border: 1px solid #C7D2FE;
            border-radius: 12px;
            padding: 10px 14px;
        }

        .date-group-card {
            background: #F8FAFC;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .date-group-header {
            font-size: 13px;
            font-weight: 700;
            color: var(--indigo-600);
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px dashed var(--border);
            display: flex;
            justify-content: space-between;
        }

        .entry-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-radius: 8px;
            background: #FFF;
            border: 1px solid var(--border);
            margin-bottom: 6px;
        }

        .entry-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .entry-icon {
            font-size: 16px;
        }

        .entry-name {
            font-size: 13px;
            font-weight: 600;
        }

        .entry-cate {
            font-size: 11px;
            color: var(--text-muted);
        }

        .entry-val {
            font-size: 13px;
            font-weight: 700;
        }

        .diary-box {
            background: var(--indigo-50);
            border: 1px solid #C7D2FE;
            border-radius: 10px;
            padding: 10px;
            margin-top: 6px;
        }

        .diary-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .diary-box-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--indigo-600);
        }

        .diary-box-content {
            font-size: 13px;
            line-height: 1.4;
            color: #334155;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--bg-surface);
            border-radius: 24px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(79, 70, 229, 0.15), 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid #C7D2FE;
            animation: slideUp 0.25s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 24px 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--indigo-600);
        }

        .modal-date-badge {
            font-size: 12px;
            font-weight: 700;
            background: var(--indigo-50);
            color: var(--indigo-600);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #C7D2FE;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-body);
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: var(--coral-500);
            color: white;
            border-color: var(--coral-500);
        }

        .modal-tabs {
            display: flex;
            margin: 16px 24px 0;
            background: var(--bg-body);
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: 14px;
            gap: 4px;
        }

        .modal-tab {
            flex: 1;
            padding: 9px 0;
            border: none;
            background: none;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .modal-tab.active {
            background: var(--bg-surface);
            color: var(--indigo-600);
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .modal-body {
            padding: 20px 24px 20px;
        }

        .form-section {
            display: none;
            flex-direction: column;
            gap: 14px;
        }

        .form-section.active {
            display: flex;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .form-input,
        .form-select,
        .form-textarea {
            padding: 10px 14px;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            font-size: 14px;
            color: var(--text-primary);
            background: #FAFBFF;
            outline: none;
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: var(--indigo-600);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .form-textarea {
            resize: vertical;
            min-height: 110px;
        }

        .type-toggle {
            display: flex;
            gap: 8px;
        }

        .type-btn {
            flex: 1;
            padding: 10px 0;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            background: #FAFBFF;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            color: var(--text-muted);
        }

        .type-btn.exp.active {
            background: #FFF1F2;
            border-color: var(--coral-500);
            color: var(--coral-500);
        }

        .type-btn.inc.active {
            background: #F0FDF4;
            border-color: var(--emerald-500);
            color: var(--emerald-500);
        }

        .mood-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mood-btn {
            padding: 6px 12px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            background: #FAFBFF;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-primary);
        }

        .mood-btn.active {
            border-color: var(--indigo-600);
            background: var(--indigo-50);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 28px;
            margin-top: 6px;
        }

        .tag-chip {
            background: var(--indigo-50);
            color: var(--indigo-600);
            border: 1px solid #C7D2FE;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tag-chip button {
            background: none;
            border: none;
            color: var(--indigo-600);
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
        }

        .modal-footer {
            padding: 0 24px 24px;
            display: flex;
            gap: 10px;
        }

        .btn-cancel {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            border: 1.5px solid var(--border);
            background: var(--bg-body);
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-cancel:hover {
            background: var(--border);
        }

        .btn-save {
            flex: 2;
            padding: 12px;
            border-radius: 14px;
            border: none;
            background: var(--indigo-600);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
            transition: all 0.2s;
        }

        .btn-save:hover {
            background: #4338CA;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35);
        }
    </style>
</head>

<body>
    <div class="dash-wrapper">
        <!-- Header -->
        <header class="dash-header">
            <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
                <div class="month-nav">
                    <button class="month-nav-btn" onclick="prevMonth()">◀</button>
                    <span class="month-label" id="currentYearMonthText">2026년 8월</span>
                    <button class="month-nav-btn" onclick="nextMonth()">▶</button>
                    <button class="today-go-btn" onclick="goToToday()">TODAY</button>
                </div>
            </div>
            <div class="metrics-group">
                <div class="metric-pill" onclick="setBudget()" style="cursor:pointer;" title="클릭하여 예산 설정">
                    <div>
                        <div class="metric-label" id="metricLabelBudget">예산(100만) 사용률 ✏️</div>
                        <div class="metric-val" id="metricValBudget" style="color:var(--indigo-600);">0%</div>
                    </div>
                </div>
                <div class="metric-pill">
                    <div>
                        <div class="metric-label" id="metricLabelBalance">8월 수입 / 지출</div>
                        <div class="metric-val" id="metricValBalance"><span style="color:var(--emerald-500);">0원</span>
                            / <span style="color:var(--coral-500);">0원</span></div>
                    </div>
                </div>
            </div>
        </header>

        <div class="dash-tab-bar">
            <button class="dash-tab active" id="tabAll" onclick="switchFilter('all')">📊 전체보기</button>
            <button class="dash-tab" id="tabLedger" onclick="switchFilter('ledger')">💰 가계부</button>
            <button class="dash-tab" id="tabDiary" onclick="switchFilter('diary')">📖 일기</button>
        </div>

        <div class="dash-body">
            <!-- Left -->
            <div>
                <div class="dash-card">
                    <div class="card-header">
                        <span class="card-title" id="calCardTitle">2026년 8월 캘린더</span>
                    </div>
                    <div class="cal-table-head">
                        <span style="color:var(--coral-500);">일</span>
                        <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span>
                        <span style="color:var(--indigo-600);">토</span>
                    </div>
                    <div class="cal-grid" id="calendarGrid"></div>
                </div>

                <div class="dash-card">
                    <div class="card-header">
                        <span class="card-title">카테고리별 지출 요약</span>
                        <span style="font-size:12px;color:var(--text-muted);" id="catMonthLabel">8월 기준</span>
                    </div>
                    <div id="categorySummaryContainer">
                        <div style="font-size:12px;color:var(--text-muted);text-align:center;padding:10px;">지출 내역이 없습니다.
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right -->
            <div>
                <div class="dash-card">
                    <div class="mode-toggle-bar">
                        <button class="mode-btn active" id="modeSelected" onclick="switchTimelineMode('selected')">📍
                            선택한 날짜</button>
                        <button class="mode-btn" id="modeAll" onclick="switchTimelineMode('all')">📜 전체 타임라인</button>
                    </div>
                    <div class="day-panel-title">
                        <span id="detailTitleText">📍 8월 9일 내역</span>
                        <div style="display:flex; gap:8px;">
                            <button onclick="openModal()"
                                style="background:var(--indigo-600);color:white;border:none;padding:7px 14px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;">✏️
                                작성하기</button>
                            <button onclick="clearAll()"
                                style="background:var(--coral-500);color:white;border:none;padding:7px 14px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;">🗑️
                                초기화</button>
                        </div>
                    </div>
                    <div id="timelineContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="writeModal">
        <div class="modal-box">
            <div class="modal-header">
                <div>
                    <div class="modal-title">✏️ 새 기록 작성</div>
                    <div style="margin-top:4px;font-size:12px;color:var(--text-muted);" id="modalDateHint">선택된 날짜에 기록을
                        추가합니다</div>
                </div>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-tabs">
                <button class="modal-tab active" id="mtabLedger" onclick="switchModalTab('ledger')">💰 가계부 작성</button>
                <button class="modal-tab" id="mtabDiary" onclick="switchModalTab('diary')">📖 일기 작성</button>
            </div>
            <div class="modal-body">
                <!-- Ledger Form -->
                <div class="form-section active" id="formLedger">
                    <div class="form-group">
                        <label class="form-label">수입 / 지출 구분</label>
                        <div class="type-toggle">
                            <button class="type-btn exp active" id="typeExp" onclick="setType('exp')">📉 지출</button>
                            <button class="type-btn inc" id="typeInc" onclick="setType('inc')">📈 수입</button>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label class="form-label">날짜</label><input class="form-input"
                                type="date" id="ledgerDate"></div>
                        <div class="form-group"><label class="form-label">금액 (원)</label><input class="form-input"
                                type="number" id="ledgerAmount" placeholder="15000"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">카테고리</label>
                            <select class="form-select" id="ledgerCategory">
                                <option value="식비">🍱 식비</option>
                                <option value="교통">🚌 교통</option>
                                <option value="문화">🎬 문화/여가</option>
                                <option value="쇼핑">🛍️ 쇼핑</option>
                                <option value="생활">🏠 생활</option>
                                <option value="의료">💊 의료</option>
                                <option value="수입">💰 수입</option>
                                <option value="기타">📌 기타</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">결제 수단</label>
                            <select class="form-select" id="ledgerPayment">
                                <option>💳 카드</option>
                                <option>💵 현금</option>
                                <option>🏦 계좌이체</option>
                                <option>🟡 카카오페이</option>
                                <option>🟢 네이버페이</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group"><label class="form-label">내용 / 사용처</label><input class="form-input"
                            type="text" id="ledgerTitle" placeholder="스타벅스 아이스 아메리카노"></div>
                    <div class="form-group"><label class="form-label">메모 (선택)</label><input class="form-input"
                            type="text" id="ledgerMemo" placeholder="간단한 메모"></div>
                </div>

                <!-- Diary Form -->
                <div class="form-section" id="formDiary">
                    <div class="form-group"><label class="form-label">날짜</label><input class="form-input" type="date"
                            id="diaryDate"></div>
                    <div class="form-group">
                        <label class="form-label">오늘의 기분</label>
                        <div class="mood-picker">
                            <button class="mood-btn active" onclick="setMood(this,'😊 행복')">😊 행복</button>
                            <button class="mood-btn" onclick="setMood(this,'😌 평온')">😌 평온</button>
                            <button class="mood-btn" onclick="setMood(this,'😢 슬픔')">😢 슬픔</button>
                            <button class="mood-btn" onclick="setMood(this,'😤 화남')">😤 화남</button>
                            <button class="mood-btn" onclick="setMood(this,'😴 피곤')">😴 피곤</button>
                            <button class="mood-btn" onclick="setMood(this,'🎉 신남')">🎉 신남</button>
                            <button class="mood-btn" onclick="setMood(this,'🤔 생각')">🤔 생각</button>
                            <button class="mood-btn" onclick="setMood(this,'💪 의욕')">💪 의욕</button>
                        </div>
                    </div>
                    <div class="form-group"><label class="form-label">제목 (선택)</label><input class="form-input"
                            type="text" id="diaryTitle" placeholder="오늘의 한 줄 제목"></div>
                    <div class="form-group"><label class="form-label">일기 내용</label><textarea class="form-textarea"
                            id="diaryContent"
                            placeholder="오늘 있었던 일, 느꼈던 감정을 자유롭게 기록해보세요 📖&#10;&#10;여기는 나만의 소중한 공간이에요 :)"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">태그 (Enter로 추가)</label>
                        <input class="form-input" type="text" id="tagInput" placeholder="#카페 #일상 #독서"
                            onkeydown="addTag(event)">
                        <div class="tag-list" id="tagList"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">취소</button>
                <button class="btn-save" onclick="saveEntry()">💾 저장하기</button>
            </div>
        </div>
    </div>

    <!-- BUDGET MODAL -->
    <div class="modal-overlay" id="budgetModal">
        <div class="modal-box" style="max-width: 400px;">
            <div class="modal-header">
                <div>
                    <div class="modal-title">🎯 목표 예산 설정</div>
                    <div style="margin-top:4px;font-size:12px;color:var(--text-muted);" id="budgetModalHint">이번 달의 목표 예산을 설정합니다</div>
                </div>
                <button class="modal-close" onclick="closeBudgetModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">금액 (원)</label>
                    <input class="form-input" type="number" id="budgetInputAmount" placeholder="1000000">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeBudgetModal()">취소</button>
                <button class="btn-save" onclick="saveBudget()">💾 저장하기</button>
            </div>
        </div>
    </div>

    <script>
        const _today = new Date();
        let currentYear = _today.getFullYear(), currentMonth = _today.getMonth() + 1, selectedDay = _today.getDate();
        let activeFilter = 'all', timelineMode = 'selected';
        let selectedMood = '😊 행복', selectedType = 'exp';
        let currentTags = [];
        let userEntries = JSON.parse(localStorage.getItem('userEntries')) || {};
        let userBudgets = JSON.parse(localStorage.getItem('userBudgets')) || {};

        const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
        function getWeekdayName(y, m, d) { return dayNames[new Date(y, m - 1, d).getDay()]; }

        function getMockData(y, m, d) {
            const key = `${y}-${m}-${d}`;
            if (!userEntries[key] || (!userEntries[key].ledger && !userEntries[key].diary)) return null;
            let base = { items: [] };
            if (userEntries[key].ledger) base.items = [...userEntries[key].ledger];
            if (userEntries[key].diary) base.diary = userEntries[key].diary;

            let exp = 0; let inc = 0;
            base.items.forEach(i => {
                const num = parseInt(i.val.replace(/[^0-9]/g, ''));
                if (i.type === 'exp') exp += num; else inc += num;
            });
            if (exp > 0) base.exp = `-${Math.round(exp / 1000) / 10}만`;
            if (inc > 0) base.inc = `+${Math.round(inc / 1000) / 10}만`;

            return base;
        }

        function prevMonth() { currentMonth--; if (currentMonth < 1) { currentMonth = 12; currentYear--; } selectedDay = 1; renderAll(); }
        function nextMonth() { currentMonth++; if (currentMonth > 12) { currentMonth = 1; currentYear++; } selectedDay = 1; renderAll(); }
        function goToToday() { const t = new Date(); currentYear = t.getFullYear(); currentMonth = t.getMonth() + 1; selectedDay = t.getDate(); renderAll(); }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid'); grid.innerHTML = '';
            const totalDays = new Date(currentYear, currentMonth, 0).getDate();
            const firstDow = new Date(currentYear, currentMonth - 1, 1).getDay();
            const prevTotal = new Date(currentYear, currentMonth - 1, 0).getDate();
            for (let i = firstDow - 1; i >= 0; i--) { const c = document.createElement('div'); c.className = 'cal-cell other-month'; c.innerHTML = `<span class="cal-date">${prevTotal - i}</span>`; grid.appendChild(c); }
            for (let d = 1; d <= totalDays; d++) {
                const cell = document.createElement('div');
                const dow = new Date(currentYear, currentMonth - 1, d).getDay();
                cell.className = `cal-cell ${d === selectedDay ? 'selected' : ''}`;
                cell.setAttribute('onclick', `selectDate(${d})`);
                const data = getMockData(currentYear, currentMonth, d);
                let infoHtml = '';
                if (data) {
                    if (data.exp) infoHtml += `<span class="tag-exp">${data.exp}</span>`;
                    if (data.inc) infoHtml += `<span class="tag-inc">${data.inc}</span>`;
                    if (data.diary) infoHtml += `<span class="tag-diary">📖</span>`;
                }
                let ds = '';
                if (dow === 0) ds = 'color:var(--coral-500);';
                if (dow === 6) ds = 'color:var(--indigo-600);';
                cell.innerHTML = `<span class="cal-date" style="${ds}">${d}</span><div class="cal-info">${infoHtml}</div>`;
                grid.appendChild(cell);
            }
            const rem = (firstDow + totalDays) % 7;
            for (let d = 1; d <= (rem === 0 ? 0 : 7 - rem); d++) { const c = document.createElement('div'); c.className = 'cal-cell other-month'; c.innerHTML = `<span class="cal-date">${d}</span>`; grid.appendChild(c); }
        }

        function selectDate(d) { selectedDay = Number(d); timelineMode = 'selected'; document.getElementById('modeSelected').classList.add('active'); document.getElementById('modeAll').classList.remove('active'); renderAll(); }
        function switchTimelineMode(m) { timelineMode = m; document.getElementById('modeSelected').classList.toggle('active', m === 'selected'); document.getElementById('modeAll').classList.toggle('active', m === 'all'); renderTimeline(); }
        function switchFilter(f) { activeFilter = f;['all', 'ledger', 'diary'].forEach(x => document.getElementById('tab' + x[0].toUpperCase() + x.slice(1)).classList.toggle('active', x === f)); renderTimeline(); }

        function renderTimeline() {
            const container = document.getElementById('timelineContainer');
            const titleEl = document.getElementById('detailTitleText');
            const totalDays = new Date(currentYear, currentMonth, 0).getDate();
            if (timelineMode === 'selected') {
                titleEl.innerText = `📍 ${currentMonth}월 ${selectedDay}일 (${getWeekdayName(currentYear, currentMonth, selectedDay)}) 내역`;
                container.innerHTML = renderDayHtml(selectedDay);
            } else {
                titleEl.innerText = `📜 ${currentYear}년 ${currentMonth}월 타임라인`;
                let html = '';
                for (let d = 1; d <= totalDays; d++) {
                    const data = getMockData(currentYear, currentMonth, d);
                    if (data) {
                        let badge = '';
                        if (data.exp) badge += `<span style="color:var(--coral-500);margin-right:6px;">${data.exp}</span>`;
                        if (data.inc) badge += `<span style="color:var(--emerald-500);">${data.inc}</span>`;
                        html += `<div class="date-group-card" onclick="selectDate(${d})" style="cursor:pointer;"><div class="date-group-header"><span>📘 ${currentMonth}월 ${d}일 (${getWeekdayName(currentYear, currentMonth, d)})</span><span style="font-size:11px;font-weight:700;">${badge}</span></div>${renderDayHtml(d)}</div>`;
                    }
                }
                if (!html) html = `<div style="font-size:13px;color:var(--text-muted);text-align:center;padding:20px;">이번 달 기록이 없습니다.</div>`;
                container.innerHTML = html;
            }
        }

        function renderDayHtml(day) {
            const data = getMockData(currentYear, currentMonth, day);
            if (!data) return `<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:10px;">기록이 없습니다.</div>`;
            let html = '';
            if ((activeFilter === 'all' || activeFilter === 'ledger') && data.items?.length > 0) {
                html += `<div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:6px;">가계부 내역</div>`;
                html += data.items.map((i, idx) => `<div class="entry-item"><div class="entry-left"><span class="entry-icon">${i.icon}</span><div><div class="entry-name">${i.name}</div><div class="entry-cate">${i.cate}</div></div></div><div style="display:flex;align-items:center;gap:12px;"><span class="entry-val" style="color:${i.type === 'inc' ? 'var(--emerald-500)' : 'var(--coral-500)'};">${i.val}</span><button onclick="event.stopPropagation(); deleteLedger(${day}, ${idx})" style="background:none;border:none;cursor:pointer;font-size:14px;color:var(--text-muted);" title="삭제">🗑️</button></div></div>`).join('');
            }
            if ((activeFilter === 'all' || activeFilter === 'diary') && data.diary) {
                html += `<div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-top:8px;margin-bottom:6px;">일기 내역</div><div class="diary-box"><div class="diary-box-header"><span class="diary-box-title">📝 ${currentMonth}월 ${day}일 일기</span><div style="display:flex;align-items:center;gap:6px;"><span style="font-size:11px;background:#FFF;padding:2px 8px;border-radius:8px;">${data.diary.mood}</span><button onclick="event.stopPropagation(); deleteDiary(${day})" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--text-muted);" title="삭제">🗑️</button></div></div><div class="diary-box-content">"${data.diary.content || data.diary.text}"</div></div>`;
            }
            return html || `<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:10px;">기록이 없습니다.</div>`;
        }

        function deleteLedger(d, idx) {
            if (confirm('이 내역을 삭제하시겠습니까?')) {
                const key = `${currentYear}-${currentMonth}-${d}`;
                if (userEntries[key] && userEntries[key].ledger) {
                    userEntries[key].ledger.splice(idx, 1);
                    if (userEntries[key].ledger.length === 0) delete userEntries[key].ledger;
                    if (Object.keys(userEntries[key]).length === 0) delete userEntries[key];
                    localStorage.setItem('userEntries', JSON.stringify(userEntries));
                    renderAll();
                }
            }
        }

        function deleteDiary(d) {
            if (confirm('이 일기를 삭제하시겠습니까?')) {
                const key = `${currentYear}-${currentMonth}-${d}`;
                if (userEntries[key] && userEntries[key].diary) {
                    delete userEntries[key].diary;
                    if (Object.keys(userEntries[key]).length === 0) delete userEntries[key];
                    localStorage.setItem('userEntries', JSON.stringify(userEntries));
                    renderAll();
                }
            }
        }

        function renderMetrics() {
            let totalExp = 0; let totalInc = 0;
            let catExp = {};
            const totalDays = new Date(currentYear, currentMonth, 0).getDate();
            for (let d = 1; d <= totalDays; d++) {
                const key = `${currentYear}-${currentMonth}-${d}`;
                if (userEntries[key] && userEntries[key].ledger) {
                    userEntries[key].ledger.forEach(i => {
                        const num = parseInt(i.val.replace(/[^0-9]/g, ''));
                        if (i.type === 'exp') {
                            totalExp += num;
                            const catKey = `${i.icon} ${i.cate}`;
                            catExp[catKey] = (catExp[catKey] || 0) + num;
                        } else {
                            totalInc += num;
                        }
                    });
                }
            }

            document.getElementById('metricValBalance').innerHTML = `<span style="color:var(--emerald-500);">+${totalInc.toLocaleString()}원</span> / <span style="color:var(--coral-500);">${totalExp > 0 ? '-' : ''}${totalExp.toLocaleString()}원</span>`;

            const budgetKey = `${currentYear}-${currentMonth}`;
            const budget = userBudgets[budgetKey] || 1000000;

            const budgetText = (budget % 10000 === 0) ? (budget / 10000) + '만' : budget.toLocaleString();

            const pct = Math.round((totalExp / budget) * 100);
            document.getElementById('metricLabelBudget').innerText = `${currentMonth}월 예산(${budgetText}) 사용률`;
            document.getElementById('metricValBudget').innerText = `${pct}% ${pct > 80 ? '(위험)' : '(안전)'}`;
            document.getElementById('metricValBudget').style.color = pct > 80 ? 'var(--coral-500)' : 'var(--indigo-600)';

            const catContainer = document.getElementById('categorySummaryContainer');
            if (totalExp === 0) {
                catContainer.innerHTML = `<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:10px;">지출 내역이 없습니다.</div>`;
            } else {
                let catHtml = '';
                const colors = ['var(--indigo-600)', 'var(--amber-500)', 'var(--coral-500)', 'var(--emerald-500)'];
                let cIdx = 0;
                Object.entries(catExp).sort((a, b) => b[1] - a[1]).forEach(([name, val]) => {
                    const perc = Math.round((val / totalExp) * 100);
                    catHtml += `<div class="cat-bar-item"><div class="cat-bar-header"><span>${name}</span><span>${val.toLocaleString()}원 (${perc}%)</span></div><div class="cat-progress"><div class="cat-fill" style="width:${perc}%;background:${colors[cIdx % colors.length]};"></div></div></div>`;
                    cIdx++;
                });
                catContainer.innerHTML = catHtml;
            }
        }

        function setBudget() {
            const key = `${currentYear}-${currentMonth}`;
            const currentBudget = userBudgets[key] || 1000000;
            document.getElementById('budgetInputAmount').value = currentBudget;
            document.getElementById('budgetModalHint').innerText = `${currentMonth}월의 목표 예산을 설정합니다`;
            document.getElementById('budgetModal').classList.add('open');
        }

        function closeBudgetModal() {
            document.getElementById('budgetModal').classList.remove('open');
        }
        
        document.getElementById('budgetModal').addEventListener('click', function (e) { if (e.target === this) closeBudgetModal(); });

        function saveBudget() {
            const key = `${currentYear}-${currentMonth}`;
            const amount = document.getElementById('budgetInputAmount').value;
            if (!amount) { alert('금액을 입력해주세요.'); return; }
            const num = parseInt(amount);
            if (!isNaN(num) && num > 0) {
                userBudgets[key] = num;
                localStorage.setItem('userBudgets', JSON.stringify(userBudgets));
                closeBudgetModal();
                renderAll();
                alert(`✅ ${currentMonth}월 목표 예산이 설정되었습니다!`);
            } else {
                alert('올바른 금액을 숫자로 입력해주세요.');
            }
        }

        function renderAll() {
            document.getElementById('currentYearMonthText').innerText = `${currentYear}년 ${currentMonth}월`;
            document.getElementById('calCardTitle').innerText = `${currentYear}년 ${currentMonth}월 캘린더`;
            document.getElementById('metricLabelBalance').innerText = `${currentMonth}월 수입 / 지출`;
            document.getElementById('catMonthLabel').innerText = `${currentMonth}월 기준`;
            renderCalendar(); renderTimeline(); renderMetrics();
        }

        /* Modal */
        function openModal() {
            document.getElementById('writeModal').classList.add('open');
            const ds = `${currentYear}-${String(currentMonth).padStart(2, '0')}-${String(selectedDay).padStart(2, '0')}`;
            document.getElementById('ledgerDate').value = ds;
            document.getElementById('diaryDate').value = ds;
            document.getElementById('modalDateHint').innerText = `${currentMonth}월 ${selectedDay}일 (${getWeekdayName(currentYear, currentMonth, selectedDay)}) 기록 추가`;
        }
        function closeModal() { document.getElementById('writeModal').classList.remove('open'); }
        document.getElementById('writeModal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });

        function switchModalTab(tab) {
            document.getElementById('mtabLedger').classList.toggle('active', tab === 'ledger');
            document.getElementById('mtabDiary').classList.toggle('active', tab === 'diary');
            document.getElementById('formLedger').classList.toggle('active', tab === 'ledger');
            document.getElementById('formDiary').classList.toggle('active', tab === 'diary');
        }
        function setType(type) { selectedType = type; document.getElementById('typeExp').classList.toggle('active', type === 'exp'); document.getElementById('typeInc').classList.toggle('active', type === 'inc'); }
        function setMood(btn, mood) { selectedMood = mood; document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
        function addTag(e) {
            if (e.key === 'Enter') { e.preventDefault(); const input = document.getElementById('tagInput'); let val = input.value.trim(); if (!val) return; if (!val.startsWith('#')) val = '#' + val; currentTags.push(val); renderTags(); input.value = ''; }
        }
        function renderTags() { document.getElementById('tagList').innerHTML = currentTags.map((t, i) => `<span class="tag-chip">${t} <button onclick="removeTag(${i})">×</button></span>`).join(''); }
        function removeTag(i) { currentTags.splice(i, 1); renderTags(); }

        function saveEntry() {
            const isLedger = document.getElementById('formLedger').classList.contains('active');
            const dateStr = document.getElementById(isLedger ? 'ledgerDate' : 'diaryDate').value;
            if (!dateStr) { alert('날짜를 선택해주세요.'); return; }
            const parts = dateStr.split('-'); const y = parseInt(parts[0]), m = parseInt(parts[1]), d = parseInt(parts[2]);
            const key = `${y}-${m}-${d}`;
            if (!userEntries[key]) userEntries[key] = {};
            if (isLedger) {
                const amount = document.getElementById('ledgerAmount').value;
                const title = document.getElementById('ledgerTitle').value;
                if (!amount || !title) { alert('금액과 내용을 입력해주세요.'); return; }
                const cat = document.getElementById('ledgerCategory').value;
                const icons = { '식비': '🍱', '교통': '🚌', '문화': '🎬', '쇼핑': '🛍️', '생활': '🏠', '의료': '💊', '수입': '💰', '기타': '📌' };
                const isInc = selectedType === 'inc';
                if (!userEntries[key].ledger) userEntries[key].ledger = [];
                userEntries[key].ledger.push({ icon: icons[cat] || '📌', name: title, cate: cat, val: `${isInc ? '+' : '-'}${parseInt(amount).toLocaleString()}원`, type: isInc ? 'inc' : 'exp' });
                alert(`✅ ${m}월 ${d}일 가계부가 저장되었습니다!`);
            } else {
                const content = document.getElementById('diaryContent').value;
                if (!content) { alert('일기 내용을 입력해주세요.'); return; }
                userEntries[key].diary = { mood: selectedMood, content, text: content };
                currentTags = []; renderTags();
                alert(`✅ ${m}월 ${d}일 일기가 저장되었습니다!`);
            }
            localStorage.setItem('userEntries', JSON.stringify(userEntries));
            closeModal(); currentYear = y; currentMonth = m; selectedDay = d; timelineMode = 'selected';
            document.getElementById('modeSelected').classList.add('active'); document.getElementById('modeAll').classList.remove('active');
            renderAll();
        }

        function clearAll() {
            if (confirm('정말 모든 기록을 초기화하시겠습니까?')) {
                userEntries = {};
                localStorage.removeItem('userEntries');
                renderAll();
                alert('모든 기록이 초기화되었습니다.');
            }
        }

        renderAll();
    </script>
</body>

</html>
