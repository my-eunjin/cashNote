<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음가계부</title>
    <meta name="theme-color" content="#4F46E5">
    <meta name="description" content="가계부와 일기를 함께 기록하는 다이어리 앱">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dash-wrapper">
        <!-- Header -->
        <header class="dash-header">
            <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
                <div class="month-nav">
                    <button class="month-nav-btn" onclick="prevMonth()">◀</button>
                    <span class="month-label" id="currentYearMonthText">2026년 8월</span>
                    <button class="month-nav-btn" onclick="nextMonth()">▶</button>
                    <button class="today-go-btn" onclick="goToToday()">TODAY</button>
                </div>
            </div>
            <div class="metrics-group">
                <div class="metric-pill" onclick="setBudget()" style="cursor:pointer;" title="클릭하여 예산 설정">
                    <div class="budget-meter" id="budgetMeter" title="예산 사용률">
                        <svg viewBox="0 0 64 64" role="img" aria-label="예산 사용률">
                            <circle class="budget-meter-track" cx="32" cy="32" r="26" />
                            <circle class="budget-meter-fill" id="budgetMeterFill" cx="32" cy="32" r="26" />
                        </svg>
                        <span class="budget-meter-text" id="budgetMeterText">0%</span>
                    </div>
                    <div>
                        <div class="metric-label" id="metricLabelBudget">예산(100만) 사용률 ✏️</div>
                        <div class="metric-val" id="metricValBudget" style="color:var(--indigo-600);">0%</div>
                    </div>
                </div>
                <div class="metric-pill">
                    <div class="ie-meter" id="ieMeter" title="수입/지출 비율">
                        <svg viewBox="0 0 64 64" role="img" aria-label="수입 대비 지출 비율">
                            <circle class="ie-meter-track" cx="32" cy="32" r="26" />
                            <circle class="ie-meter-inc" id="ieMeterInc" cx="32" cy="32" r="26" />
                            <circle class="ie-meter-exp" id="ieMeterExp" cx="32" cy="32" r="26" />
                        </svg>
                    </div>
                    <div>
                        <div class="metric-label" id="metricLabelBalance">8월 수입 / 지출</div>
                        <div class="metric-val" id="metricValBalance"><span style="color:var(--emerald-500);">0원</span>
                            / <span style="color:var(--coral-500);">0원</span></div>
                    </div>
                </div>
            </div>
        </header>

        <div class="dash-tab-bar">
            <div class="dash-tab-group">
                <button class="dash-tab active" id="tabAll" onclick="switchFilter('all')">📊 전체보기</button>
                <button class="dash-tab" id="tabLedger" onclick="switchFilter('ledger')">💰 가계부</button>
                <button class="dash-tab" id="tabDiary" onclick="switchFilter('diary')">📖 일기</button>
            </div>
            <div class="dash-tab-actions">
                <button class="tab-icon-btn" onclick="backupData()" title="백업 파일로 저장">💾 백업</button>
                <button class="tab-icon-btn" onclick="document.getElementById('restoreFileInput').click()"
                    title="백업 파일 불러오기">📥 복원</button>
                <button class="tab-reset-btn" onclick="clearAll()">초기화</button>
            </div>
            <button class="tab-menu-toggle" id="tabMenuToggle" onclick="toggleTabMenu()" title="메뉴">☰</button>
        </div>

        <input type="file" id="restoreFileInput" accept="application/json" style="display:none"
            onchange="restoreData(event)">

        <div class="tab-menu-overlay" id="tabMenuOverlay" onclick="closeTabMenu()"></div>
        <div class="tab-menu-drawer" id="tabMenuDrawer">
            <div class="tab-menu-header">
                <span>메뉴</span>
                <button class="modal-close" onclick="closeTabMenu()">✕</button>
            </div>
            <button class="tab-menu-item" onclick="closeTabMenu(); backupData();">💾 백업 파일로 저장</button>
            <button class="tab-menu-item"
                onclick="closeTabMenu(); document.getElementById('restoreFileInput').click();">📥 백업 파일 불러오기</button>
            <button class="tab-menu-item danger" onclick="closeTabMenu(); clearAll();">🗑️ 전체 초기화</button>
        </div>

        <div class="dash-body">
            <!-- Left -->
            <div>
                <div class="dash-card">
                    <div class="cal-table-head">
                        <span style="color:var(--coral-500);">일</span>
                        <span>월</span><span>화</span><span>수</span><span>목</span><span>금</span>
                        <span style="color:var(--indigo-600);">토</span>
                    </div>
                    <div class="cal-grid" id="calendarGrid"></div>
                </div>

                <div class="dash-card">
                    <div class="card-header">
                        <span class="card-title">카테고리별 지출 요약</span>
                        <span style="font-size:12px;color:var(--text-muted);" id="catMonthLabel">8월 기준</span>
                    </div>
                    <div id="categorySummaryContainer">
                        <div style="font-size:12px;color:var(--text-muted);text-align:center;padding:10px;">지출 내역이 없습니다.
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right -->
            <div>
                <div class="dash-card">
                    <div class="mode-toggle-bar">
                        <button class="mode-btn active" id="modeSelected" onclick="switchTimelineMode('selected')">📍
                            선택한 날짜</button>
                        <button class="mode-btn" id="modeAll" onclick="switchTimelineMode('all')">📜 전체 타임라인</button>
                    </div>
                    <div class="day-panel-title">
                        <span id="detailTitleText">📍 8월 9일</span>
                    </div>
                    <div id="timelineContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="support-footer">
        <button class="support-link" onclick="donateSupport()">☕ 개발자 후원하기</button>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="writeModal">
        <div class="modal-box">
            <div class="modal-header">
                <div>
                    <div class="modal-title">✏️ 새 기록 작성</div>
                    <div style="margin-top:4px;font-size:12px;color:var(--text-muted);" id="modalDateHint">선택된 날짜에 기록을
                        추가합니다</div>
                </div>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-tabs">
                <button class="modal-tab active" id="mtabLedger" onclick="switchModalTab('ledger')">💰 가계부 작성</button>
                <button class="modal-tab" id="mtabDiary" onclick="switchModalTab('diary')">📖 일기 작성</button>
            </div>
            <div class="modal-body">
                <!-- Ledger Form -->
                <div class="form-section active" id="formLedger">
                    <div class="form-group">
                        <label class="form-label">수입 / 지출 구분</label>
                        <div class="type-toggle">
                            <button class="type-btn exp active" id="typeExp" onclick="setType('exp')">📉 지출</button>
                            <button class="type-btn inc" id="typeInc" onclick="setType('inc')">📈 수입</button>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label class="form-label">날짜</label><input class="form-input"
                                type="date" id="ledgerDate"></div>
                        <div class="form-group"><label class="form-label">금액 (원)</label><input class="form-input"
                                type="number" id="ledgerAmount" placeholder="15000"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">반복 설정</label>
                        <div class="repeat-row">
                            <button type="button" class="repeat-btn" id="repeatToggle" onclick="toggleRepeat()">
                                <span id="repeatCheckIcon">⬜</span><span>🔁 매월 반복</span>
                            </button>
                            <div class="repeat-info" id="repeatInfo">반복 없음 · 선택한 날짜에만 기록됩니다</div>
                        </div>
                        <div class="repeat-detail" id="repeatDetail">
                            <label class="form-label">반복 기간</label>
                            <select class="form-select" id="repeatDuration" onchange="updateRepeatInfo()">
                                <option value="0">계속 반복 (무기한)</option>
                                <option value="3">3개월</option>
                                <option value="6">6개월</option>
                                <option value="12">12개월</option>
                                <option value="24">24개월</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">카테고리</label>
                            <!-- 숨겨진 실제 select (JS에서 값 읽기용) -->
                            <input type="hidden" id="ledgerCategory" value="식비">
                            <div class="custom-select-wrapper" id="categorySelectWrapper">
                                <div class="custom-select-trigger" id="categoryTrigger"
                                    onclick="toggleCategoryDropdown()">
                                    <span id="categoryTriggerText">🍚 식비</span>
                                    <span class="arrow">▼</span>
                                </div>
                                <div class="custom-select-dropdown" id="categoryDropdown">
                                    <!-- JS로 동적 렌더링 -->
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">결제 수단</label>
                            <select class="form-select" id="ledgerPayment">
                                <option>💳 카드</option>
                                <option>💵 현금</option>
                                <option>🏦 계좌이체</option>
                                <option>🟡 카카오페이</option>
                                <option>🟢 네이버페이</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group"><label class="form-label">내용 / 사용처</label><input class="form-input"
                            type="text" id="ledgerTitle" placeholder="스타벅스 아이스 아메리카노"></div>
                    <div class="form-group"><label class="form-label">메모 (선택)</label><input class="form-input"
                            type="text" id="ledgerMemo" placeholder="간단한 메모"></div>
                </div>

                <!-- Diary Form -->
                <div class="form-section" id="formDiary">
                    <div class="form-group"><label class="form-label">날짜</label><input class="form-input" type="date"
                            id="diaryDate"></div>
                    <div class="form-group">
                        <label class="form-label">오늘의 기분</label>
                        <div class="mood-picker">
                            <button class="mood-btn active" onclick="setMood(this,'😊 행복')">😊 행복</button>
                            <button class="mood-btn" onclick="setMood(this,'😌 평온')">😌 평온</button>
                            <button class="mood-btn" onclick="setMood(this,'😢 슬픔')">😢 슬픔</button>
                            <button class="mood-btn" onclick="setMood(this,'😤 화남')">😤 화남</button>
                            <button class="mood-btn" onclick="setMood(this,'😴 피곤')">😴 피곤</button>
                            <button class="mood-btn" onclick="setMood(this,'🎉 신남')">🎉 신남</button>
                            <button class="mood-btn" onclick="setMood(this,'🤔 생각')">🤔 생각</button>
                            <button class="mood-btn" onclick="setMood(this,'💪 의욕')">💪 의욕</button>
                        </div>
                    </div>
                    <div class="form-group"><label class="form-label">제목 (선택)</label><input class="form-input"
                            type="text" id="diaryTitle" placeholder="오늘의 한 줄 제목"></div>
                    <div class="form-group"><label class="form-label">일기 내용</label><textarea class="form-textarea"
                            id="diaryContent"
                            placeholder="오늘 있었던 일, 느꼈던 감정을 자유롭게 기록해보세요 📖&#10;&#10;여기는 나만의 소중한 공간이에요 :)"></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">태그 (Enter로 추가)</label>
                        <input class="form-input" type="text" id="tagInput" placeholder="#카페 #일상 #독서"
                            onkeydown="addTag(event)">
                        <div class="tag-list" id="tagList"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">취소</button>
                <button class="btn-save" onclick="saveEntry()">💾 저장하기</button>
            </div>
        </div>
    </div>

    <!-- BUDGET MODAL -->
    <div class="modal-overlay" id="budgetModal">
        <div class="modal-box" style="max-width: 400px;">
            <div class="modal-header">
                <div>
                    <div class="modal-title">🎯 목표 예산 설정</div>
                    <div style="margin-top:4px;font-size:12px;color:var(--text-muted);" id="budgetModalHint">이번 달의 목표
                        예산을 설정합니다</div>
                </div>
                <button class="modal-close" onclick="closeBudgetModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">금액 (원)</label>
                    <input class="form-input" type="number" id="budgetInputAmount" placeholder="1000000">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeBudgetModal()">취소</button>
                <button class="btn-save" onclick="saveBudget()">💾 저장하기</button>
            </div>
        </div>
    </div>

    <!-- RECURRING EDIT MODAL -->
    <div class="modal-overlay" id="recurringModal">
        <div class="modal-box" style="max-width: 460px;">
            <div class="modal-header">
                <div>
                    <div class="modal-title">🔁 반복 항목 수정</div>
                    <div style="margin-top:4px;font-size:12px;color:var(--text-muted);" id="recurringHint">매월 반복되는 기록입니다
                    </div>
                </div>
                <button class="modal-close" onclick="closeRecurringModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-section active">
                    <div class="form-group">
                        <label class="form-label">수입 / 지출 구분</label>
                        <div class="type-toggle">
                            <button class="type-btn exp" id="recTypeExp" onclick="setRecType('exp')">📉 지출</button>
                            <button class="type-btn inc" id="recTypeInc" onclick="setRecType('inc')">📈 수입</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">금액 (원)</label>
                        <input class="form-input" type="number" id="recurringAmount" placeholder="500000">
                    </div>
                    <div class="form-group">
                        <label class="form-label">내용 / 사용처</label>
                        <input class="form-input" type="text" id="recurringTitle" placeholder="월세">
                    </div>
                    <div class="form-group">
                        <label class="form-label">반복 날짜 (매월)</label>
                        <select class="form-select" id="recurringDay"></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">적용 범위</label>
                        <div class="scope-toggle">
                            <button class="scope-btn active" id="scopeOne" onclick="setRecScope('one')">이 달만</button>
                            <button class="scope-btn" id="scopeAll" onclick="setRecScope('all')">이 달부터 전체</button>
                        </div>
                        <div style="font-size:11px;color:var(--text-muted);margin-top:6px;" id="recScopeHint">이번 달 기록만
                            변경됩니다.</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-danger" onclick="deleteRecurring()">🗑️ 삭제</button>
                <button class="btn-save" onclick="saveRecurringEdit()">💾 저장하기</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
